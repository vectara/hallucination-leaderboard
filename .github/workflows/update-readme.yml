name: Update Leaderboard

# Manual only: run from the Actions tab ("Run workflow") when you want the
# README table and plot regenerated on GitHub. It no longer fires on push;
# the normal flow is to run `python update_readme.py` locally and push the result.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-action.txt

      - name: Run update script
        run: python update_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md img/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update leaderboard and plot"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
